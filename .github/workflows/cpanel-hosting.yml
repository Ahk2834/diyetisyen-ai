name: cPanel Hosting Package
on:
  workflow_dispatch:
  push:
    branches: [full-v1-development]
    paths:
      - 'wordpress/**'
      - 'src/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'tests/**'
      - 'public/**'
      - '.github/workflows/cpanel-hosting.yml'
      - 'server/**'
      - 'hosting/private/**'
      - 'database/migrations/**'
      - 'docs/DAVET_KODLU_UYELIK_KURULUM.md'
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Build for cPanel subdirectory
        env:
          HOSTING_BASE_PATH: diyetisyen-ai
        run: npm run build
      - name: Verify generated site
        run: |
          test -s dist/index.html
          test -d dist/assets
          grep -q '/diyetisyen-ai/assets/' dist/index.html
      - name: Create single home-directory extraction ZIP
        run: |
          set -eu
          mkdir -p release/public_html/diyetisyen-ai/api release/diyetai_private release/kurulum
          cp -R dist/. release/public_html/diyetisyen-ai/
          cp server/public/api/google-auth.php server/public/api/google-session.php server/public/api/admin-invitations.php release/public_html/diyetisyen-ai/api/
          cp hosting/private/auth_core.php server/private/google_account_service.php server/private/google_token_verify.php server/private/google_session.php release/diyetai_private/
          cp database/migrations/002_invitation_activation.sql database/migrations/003_create_invitation_phpmyadmin.sql database/migrations/004_invitation_revocation.sql release/kurulum/
          cp server/private/admin_config.example.php release/kurulum/admin_config.example.php
          cp docs/DAVET_KODLU_UYELIK_KURULUM.md release/kurulum/
          test ! -e release/diyetai_private/db_config.php
          test ! -e release/public_html/diyetisyen-ai/kurulum
          cd release
          zip -qr ../diyetisyen-ai-TEK-PAKET.zip .
      - name: Verify single package layout
        run: |
          unzip -l diyetisyen-ai-TEK-PAKET.zip | grep -q 'public_html/diyetisyen-ai/index.html'
          unzip -l diyetisyen-ai-TEK-PAKET.zip | grep -q 'public_html/diyetisyen-ai/api/google-auth.php'
          unzip -l diyetisyen-ai-TEK-PAKET.zip | grep -q 'diyetai_private/google_token_verify.php'
          unzip -l diyetisyen-ai-TEK-PAKET.zip | grep -q 'kurulum/002_invitation_activation.sql'
      - name: Upload cPanel package
        uses: actions/upload-artifact@v4
        with:
          name: diyetisyen-ai-TEK-PAKET
          path: diyetisyen-ai-TEK-PAKET.zip
          retention-days: 14
          if-no-files-found: error

      - name: Prepare installable WordPress plugin artifact
        run: |
          set -eu
          mkdir -p wp-release/diet-ai-updater
          cp wordpress/diet-ai-updater/diet-ai-updater.php wp-release/diet-ai-updater/
          php -l wp-release/diet-ai-updater/diet-ai-updater.php
          test -s wp-release/diet-ai-updater/diet-ai-updater.php
      - name: Upload WordPress-installable plugin directory
        uses: actions/upload-artifact@v4
        with:
          name: diet-ai-wordpress-guncelleyici-DIREKT-YUKLE
          path: wp-release/
          retention-days: 14
          if-no-files-found: error
