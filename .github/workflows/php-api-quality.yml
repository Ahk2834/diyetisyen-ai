name: PHP API Quality Checks
on:
  push:
    branches: [full-v1-development]
    paths:
      - 'hosting/**'
      - '.github/workflows/php-api-quality.yml'
  pull_request:
    branches: [main, full-v1-development]
    paths:
      - 'hosting/**'
      - '.github/workflows/php-api-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -v
          find hosting -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Verify auth stays disabled by default
        run: |
          grep -q 'registration_not_enabled' hosting/api/auth.php
          grep -q 'login_not_enabled' hosting/api/auth.php
      - name: Test authentication password primitives
        run: php hosting/tests/auth_core_test.php
      - name: Test secure cookie and origin policy
        run: php hosting/tests/auth_http_test.php
      - name: Test login attempt limiting helpers
        run: php hosting/tests/auth_rate_limit_test.php
      - name: Test rate-limit DB helper guards
        run: php hosting/tests/auth_rate_limit_db_test.php
      - name: Test private login service input guards
        run: php hosting/tests/auth_login_service_test.php
      - name: Verify login is disabled without private configuration
        run: php hosting/tests/auth_login_handler_test.php
