name: PHP API Quality Checks
on:
  push:
    branches: [full-v1-development]
    paths:
      - 'hosting/**'
      - '.github/workflows/php-api-quality.yml'
  pull_request:
    branches: [main, full-v1-development]
    paths:
      - 'hosting/**'
      - '.github/workflows/php-api-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php-lint:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-root-password
          MYSQL_DATABASE: diyetai_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptest-only-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -v
          find hosting -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Verify auth stays disabled by default
        run: |
          grep -q 'registration_not_enabled' hosting/api/auth.php
          grep -q 'login_not_enabled' hosting/private/auth_login_handler.php
      - name: Test authentication password primitives
        run: php hosting/tests/auth_core_test.php
      - name: Test secure cookie and origin policy
        run: php hosting/tests/auth_http_test.php
      - name: Test login attempt limiting helpers
        run: php hosting/tests/auth_rate_limit_test.php
      - name: Test rate-limit DB helper guards
        run: php hosting/tests/auth_rate_limit_db_test.php
      - name: Test private login service input guards
        run: php hosting/tests/auth_login_service_test.php
      - name: Verify login is disabled without private configuration
        run: php hosting/tests/auth_login_handler_test.php
      - name: Test registration validation and disabled persistence
        run: php hosting/tests/auth_registration_test.php
      - name: Test email verification token rules
        run: php hosting/tests/auth_email_verification_test.php
      - name: Test email verification database guards
        run: php hosting/tests/auth_email_verification_db_test.php
      - name: Check SQL and PHP authentication schema contract
        run: php hosting/tests/auth_schema_contract_test.php
      - name: Test MySQL account verification lifecycle
        env:
          AUTH_TEST_MYSQL_DSN: mysql:host=127.0.0.1;port=3306;dbname=diyetai_ci;charset=utf8mb4
          AUTH_TEST_MYSQL_USER: root
          AUTH_TEST_MYSQL_PASSWORD: test-only-root-password
        run: php hosting/tests/auth_mysql_integration_test.php
      - name: Test verification email content
        run: php hosting/tests/auth_verification_mail_test.php
      - name: Test verification mail delivery adapter
        run: php hosting/tests/auth_mail_delivery_test.php
      - name: Test private verification handler input guards
        run: php hosting/tests/auth_verify_handler_test.php
      - name: Test verification API disabled-by-default policy
        run: php hosting/tests/auth_verify_request_test.php
