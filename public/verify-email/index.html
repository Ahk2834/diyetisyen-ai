<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-store">
<title>E-posta Doğrulama | Diyetisyen AI</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#173b32;background:#f3f8f5}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(440px,calc(100% - 48px));padding:32px;border-radius:18px;background:white;box-shadow:0 8px 36px #17453617}
h1{font-size:1.5rem}p{line-height:1.6}a{color:#12694b}button{padding:12px 20px;background:#17694e;color:white;border:0;border-radius:9px;font:inherit;cursor:pointer}button:disabled{opacity:.6}
</style>
</head>
<body>
<main>
<h1>E-posta adresinizi doğrulayın</h1>
<p id="status" role="status" aria-live="polite">Bağlantı kontrol ediliyor…</p>
<button id="confirm" type="button" hidden>Doğrulamayı tamamla</button>
<p><a href="/diyetisyen-ai/">Diyetisyen AI ana sayfasına dön</a></p>
</main>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || '';
  var status = document.getElementById('status');
  var button = document.getElementById('confirm');
  // Keep token out of address bar and browser history before any request.
  history.replaceState(null, '', location.pathname);
  if (!/^[a-f0-9]{64}$/.test(token)) {
    status.textContent = 'Doğrulama bağlantısı geçersiz veya eksik.';
    return;
  }
  status.textContent = 'E-posta adresinizi doğrulamak için aşağıdaki düğmeye basın.';
  button.hidden = false;
  button.addEventListener('click', async function () {
    button.disabled = true;
    status.textContent = 'Doğrulama yapılıyor…';
    try {
      var response = await fetch('/diyetisyen-ai/api/auth.php', {
        method: 'POST',
        credentials: 'same-origin',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({action: 'verify_email', token: token})
      });
      var result = await response.json();
      if (response.ok && result.ok === true) {
        status.textContent = 'E-posta adresiniz doğrulandı. Artık giriş yapabilirsiniz.';
        button.hidden = true;
        token = '';
      } else if (response.status === 503) {
        status.textContent = 'Doğrulama hizmeti henüz etkin değil. Lütfen daha sonra tekrar deneyin.';
      } else {
        status.textContent = 'Bağlantı geçersiz, kullanılmış veya süresi dolmuş olabilir.';
      }
    } catch (_) {
      status.textContent = 'Sunucuya bağlanılamadı. Lütfen daha sonra tekrar deneyin.';
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
</body>
</html>
